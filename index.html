<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>W2H Tool v1.9.3 – Append + Workflow (Supabase Auth)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background-color: #0099ff; padding: 20px; color:#001b33; }
    input, button, textarea {
      width: 100%; padding: 10px; margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      border-radius: 8px; border: 1px solid #0a74da;
    }
    textarea { height: 220px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .ok { color: #0a7a18; font-weight:600; }
    .error { color: #b00020; font-weight:600; }
    .import { background-color: #0055cc; color: #fff; font-weight: 700; border: none; }
    .primary { background:#003a99; color:#fff; font-weight:700; border:none; }
    .muted { opacity:.7; }
    .bar { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
    .bar > * { flex:0 0 auto; }
    .pill { padding:6px 10px; background:#fff; border-radius:999px; font-size:12px; border:1px solid rgba(0,0,0,.06) }
    .hidden { display:none; }
    .card { background:#f7fbff; border:1px solid #d5e9ff; border-radius:14px; padding:14px; }
  </style>
  <script>
    // ENTER löst automatisch die Hauptaktion aus
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("inputText");
      if (el) {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            los();
          }
        });
      }
    });
  </script>
</head>
<body>

<h2>🌍 W2H Tool v1.9.3 – Live Place ID Fetch + Import Workflow</h2>

<div class="bar">
  <span id="auth-status" class="pill muted">Nicht eingeloggt</span>
  <!-- Inline onclick, damit der Button sicher funktioniert -->
  <button id="btn-login" class="primary" onclick="loginClick()">Login</button>
  <button id="btn-logout" class="hidden" onclick="logoutClick()">Logout</button>
</div>

<div class="card">
  <label>🄤 Eingabe (z. B. Plus Code oder Ortsname):</label>
  <input id="inputText" placeholder="z. B. 9C3W+X7 Wien oder Hotel Lipa Piran" />

  <label>Bevorzugter Name (optional):</label>
  <input id="preferredName" placeholder="z. B. Trattoria Caprese Trieste" />

  <div id="secure-panel" class="hidden">
    <div class="row">
      <button onclick="los()" class="primary">➡️ Place ID abrufen &amp; speichern</button>
      <button onclick="startWorkflow()" class="import">🔁 Import &amp; Export auslösen</button>
    </div>
  </div>

  <p class="muted" style="margin-top:10px">
    Hinweis: Der GitHub-Token wird <b>serverseitig</b> als Secret verwendet. Kein Token-Feld mehr im Browser.
  </p>
</div>

<h3>📄 Log</h3>
<textarea id="log" readonly></textarea>

<!-- =========================
     Auth + Secure Function
========================= -->
<script type="module">
  // ==== 1) Supabase Client initialisieren ====
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // TODO: HIER EINTRAGEN (Anon-Key ist öffentlich einsetzbar)
  const SUPABASE_URL = '<SUPABASE_URL_HERE>';
  const SUPABASE_ANON_KEY = '<SUPABASE_ANON_KEY_HERE>';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ==== 2) UI-Helfer ====
  const $login   = document.getElementById('btn-login');
  const $logout  = document.getElementById('btn-logout');
  const $status  = document.getElementById('auth-status');
  const $panel   = document.getElementById('secure-panel');
  const $log     = document.getElementById('log');

  function setUI(isAuthed, email='') {
    if (isAuthed) {
      $status.textContent = `Eingeloggt${email ? ' – ' + email : ''}`;
      $status.classList.remove('muted');
      $login.classList.add('hidden');
      $logout.classList.remove('hidden');
      $panel.classList.remove('hidden');
    } else {
      $status.textContent = 'Nicht eingeloggt';
      $status.classList.add('muted');
      $login.classList.remove('hidden');
      $logout.classList.add('hidden');
      $panel.classList.add('hidden');
    }
  }

  // Bei Laden Sitzungsstatus prüfen
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    setUI(!!session, session?.user?.email || '');
  })();

  // ==== 3) Sicheren Function-Aufruf kapseln ====
  async function callSecure(action, payload) {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error('Nicht eingeloggt');
    const res = await fetch('/.netlify/functions/w2h-import', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ action, payload })
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // ==== 4) Resolver-Helfer ====
  function extractPlace(json) {
    if (json && json.ok && json.resolved?.placeId) {
      return {
        placeId: json.resolved.placeId,
        name: json.resolved.name || null,
        meta: { tried: json.tried || [], params: json.params || {} }
      };
    }
    const cand = json?.result?.candidates;
    if (Array.isArray(cand) && cand.length > 0 && cand[0]?.place_id) {
      return {
        placeId: cand[0].place_id,
        name: cand[0].name || null,
        meta: { legacy: true }
      };
    }
    return null;
  }

  function guessRegion(input){
    const t = (input || "").toLowerCase();
    if (t.includes('piran') || t.includes('portoro') || t.includes('sloven')) return { country:'si', lang:'sl' };
    if (t.includes('split') || t.includes('zadar') || t.includes('croat') || t.includes('hrvat')) return { country:'hr', lang:'hr' };
    if (t.includes('trieste') || t.includes('venezia') || t.includes('ital')) return { country:'it', lang:'it' };
    return { country:'at', lang:'de' };
  }

  // ==== 5) Hauptaktion: Place ID ermitteln & serverseitig speichern ====
  window.los = async function los() {
    const input = document.getElementById("inputText").value.trim();
    const preferredNameInput = document.getElementById("preferredName").value.trim();

    if (!input) {
      $log.value += "⚠️ Bitte Eingabe prüfen\n";
      return;
    }

    const region = guessRegion(input);
    $log.value += `🔍 Suche Ort: ${input} (${region.country}/${region.lang})\n`;

    try {
      // Deine bestehende Resolver-Function (liefert placeId + optional name)
      const qs = new URLSearchParams({ input, country: region.country, lang: region.lang });
      const response = await fetch(`/.netlify/functions/places?${qs.toString()}`);
      const result = await response.json();

      const hit = extractPlace(result);
      if (!hit) {
        $log.value += "❌ Kein Ort gefunden. Prüfe Eingabe.\n";
        console.debug("Response ohne Treffer:", result);
        return;
      }

      const placeId = hit.placeId;
      const nameFromApi = hit.name || input;
      const preferredName = preferredNameInput || nameFromApi;

      $log.value += `✅ Gefunden: ${nameFromApi || "(ohne Namen)"} → ${placeId}\n`;

      // Serverseitiges Append in place_ids.json (+ evtl. Archive) über sichere Function
      await callSecure('appendPlaceId', { placeId, preferredName });
      $log.value += "💾 Server: Place ID gespeichert.\n";
    } catch (err) {
      console.error(err);
      $log.value += `🔥 Fehler bei der Abfrage:\n${err.message || err}\n`;
    }
  }

  // ==== 6) Workflow starten (sicher, ohne Token im Browser) ====
  window.startWorkflow = async function startWorkflow() {
    try {
      $log.value += "🚀 Starte Workflow (serverseitig)…\n";
      const out = await callSecure('dispatchImport', {});
      if (out && out.triggered) {
        $log.value += "✅ Workflow erfolgreich gestartet (Import & Export).\n";
      } else {
        $log.value += "ℹ️ Antwort: " + JSON.stringify(out) + "\n";
      }
    } catch (err) {
      $log.value += `❌ Fehler beim Starten des Workflows:\n${err.message || err}\n`;
    }
  }

  // ==== 7) Globale Klick-Handler für die Buttons (inline aufgerufen) ====
  window.loginClick = async function () {
    try {
      const email = prompt('E-Mail für Login:');
      if (!email) return;
      const password = prompt('Passwort:');
      if (!password) return;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;

      setUI(true, data.user?.email || email);
      $log.value += `✅ Eingeloggt als ${data.user?.email || email}\n`;
    } catch (e) {
      $log.value += `❌ Login fehlgeschlagen: ${e.message || e}\n`;
    }
  };

  window.logoutClick = async function () {
    await supabase.auth.signOut();
    setUI(false, '');
    $log.value += '👋 Abgemeldet\n';
  };

  console.log('[w2h] auth module loaded');
</script>

</body>
</html>
