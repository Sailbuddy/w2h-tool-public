<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>W2H Tool v1.9.3 – Append + Workflow</title>
  <style>
    body { font-family: sans-serif; background-color: #0099ff; padding: 20px; }
    input, button, textarea {
      width: 100%; padding: 10px; margin-top: 8px;
      font-family: monospace;
    }
    textarea { height: 200px; }
    .ok { color: green; }
    .error { color: red; }
    button.import {
      background-color: #0055cc;
      color: white;
      font-weight: bold;
    }
  </style>
  <script>
    // ENTER löst automatisch die Hauptaktion aus
    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("inputText");
      if (el) {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            los();
          }
        });
      }
    });
  </script>
</head>
<body>

<h2>🌍 W2H Tool v1.9.3 – Live Place ID Fetch + Import Workflow</h2>

<label>🄤 Eingabe (z. B. Plus Code oder Ortsname):</label>
<input id="inputText" placeholder="z. B. 9C3W+X7 Wien oder Hotel Lipa Piran" />

<label>Bevorzugter Name (optional):</label>
<input id="preferredName" placeholder="z. B. Trattoria Caprese Trieste" />

<label>🔐 GitHub Token:</label>
<input id="token" type="password" placeholder="ghp_..." />

<label>📦 GitHub Repo (z. B. Sailbuddy/w2h-places-import):</label>
<input id="repo" value="Sailbuddy/w2h-places-import" />

<button onclick="los()">➡️ Place ID abrufen & speichern</button>

<button onclick="startWorkflow()" class="import">🔁 Import & Export auslösen</button>

<h3>📄 Log</h3>
<textarea id="log" readonly></textarea>

<script>
  // --- Einstellungen ---
  const USE_LIMIT = false;
  const MAX_LIMIT = 10;
  // Wichtig: Server schreibt bereits in die JSONs → Client NICHT nochmal hochladen
  const SERVER_DOES_UPLOAD = true;

  // -----------------------------
  // Parser: versteht neues und altes Response-Format
  // -----------------------------
  function extractPlace(json) {
    // Neues Format (unsere Function)
    if (json && json.ok && json.resolved?.placeId) {
      return {
        placeId: json.resolved.placeId,
        name: json.resolved.name || null,
        meta: { tried: json.tried || [], params: json.params || {} }
      };
    }
    // Altes Google-Format (frühere Zeit)
    const cand = json?.result?.candidates;
    if (Array.isArray(cand) && cand.length > 0 && cand[0]?.place_id) {
      return {
        placeId: cand[0].place_id,
        name: cand[0].name || null,
        meta: { legacy: true }
      };
    }
    return null;
  }

  // -----------------------------
  // Einfache Heuristik für Country/Language (optional)
  // -----------------------------
  function guessRegion(input){
    const t = (input || "").toLowerCase();
    if (t.includes('piran') || t.includes('portoro') || t.includes('sloven')) return { country:'si', lang:'sl' };
    if (t.includes('split') || t.includes('zadar') || t.includes('croat') || t.includes('hrvat')) return { country:'hr', lang:'hr' };
    if (t.includes('trieste') || t.includes('venezia') || t.includes('ital')) return { country:'it', lang:'it' };
    return { country:'at', lang:'de' }; // Default
  }

  // -----------------------------
  // Hauptfunktion: Ort suchen (Server speichert; Client optional)
  // -----------------------------
  async function los() {
    const input = document.getElementById("inputText").value.trim();
    const preferredNameInput = document.getElementById("preferredName").value.trim();
    const token = document.getElementById("token").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const log = document.getElementById("log");

    if (!input || !token || !repo) {
      log.value += "⚠️ Bitte Eingabe, Token und Repo prüfen\n";
      return;
    }

    // Region automatisch raten (optional, erhöht Stabilität)
    const region = guessRegion(input);
    log.value += `🔍 Suche Ort: ${input} (${region.country}/${region.lang})\n`;

    try {
      // Function-Aufruf (mit optionalem Bias)
      const qs = new URLSearchParams({ input, country: region.country, lang: region.lang });
      const response = await fetch(`/.netlify/functions/places?${qs.toString()}`);
      const result = await response.json();

      const hit = extractPlace(result);
      if (!hit) {
        log.value += "❌ Kein Ort gefunden. Prüfe Eingabe.\n";
        console.debug("Response ohne Treffer:", result);
        return;
      }

      const placeId = hit.placeId;
      const nameFromApi = hit.name || input;
      const preferredName = preferredNameInput || nameFromApi;

      log.value += `✅ Gefunden: ${nameFromApi || "(ohne Namen)"} → ${placeId}\n`;

      // Wenn der Server speichert, hier beenden (kein Client-Upload, kein Dubletten-Check)
      if (SERVER_DOES_UPLOAD) {
        log.value += "💾 Speichern erfolgt serverseitig. (Kein Client-Upload nötig)\n";
        return;
      }

      // === Ab hier nur aktiv, wenn SERVER_DOES_UPLOAD = false ===

      // Duplikate prüfen (im Archiv)
      const isDuplicate = await checkIfExistsByPlaceId(repo, token, "data/place_ids_archive.json", placeId);
      if (isDuplicate) {
        log.value += "⚠️ ID bereits im Archiv. Kein neuer Eintrag nötig.\n";
        return;
      }

      if (USE_LIMIT) {
        const count = await getEntryCount(repo, token, "data/place_ids.json");
        if (count >= MAX_LIMIT) {
          log.value += `⛔ Limit erreicht (${MAX_LIMIT} Einträge). Bitte Daten abrufen.\n`;
          return;
        }
      }

      const newEntry = { placeId, preferredName };

      await uploadJsonObjects(repo, token, "data/place_ids.json", [newEntry], true);
      await uploadJsonObjects(repo, token, "data/place_ids_archive.json", [newEntry], true);

    } catch (err) {
      console.error(err);
      log.value += `🔥 Fehler bei der Abfrage:\n${err.message || err}\n`;
    }
  }

  // -----------------------------
  // GitHub Hilfsfunktionen (für Client-Upload; aktuell inaktiv)
  // -----------------------------
  async function checkIfExistsByPlaceId(repo, token, path, placeId) {
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
    if (!res.ok) return false;
    const json = await res.json();
    const content = JSON.parse(atob(json.content));
    return content.some(item => item.placeId === placeId);
  }

  async function getEntryCount(repo, token, path) {
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
    if (!res.ok) return 0;
    const json = await res.json();
    const content = JSON.parse(atob(json.content));
    return content.length;
  }

  async function uploadJsonObjects(repo, token, path, data, append) {
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const log = document.getElementById("log");
    let sha = null;
    let existing = [];

    const check = await fetch(url, { headers: { Authorization: `token ${token}` } });
    if (check.ok) {
      const json = await check.json();
      sha = json.sha;
      existing = JSON.parse(atob(json.content));
    }

    const merged = append
      ? [...existing.filter(e => !data.some(d => d.placeId === e.placeId)), ...data]
      : data;

    const b64 = btoa(JSON.stringify(merged, null, 2));

    const res = await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `🌍 W2H Live Fetch Upload ${new Date().toISOString()}`,
        content: b64,
        sha: sha || undefined
      })
    });

    if (res.ok) {
      log.value += `✅ Hochgeladen nach ${path}\n`;
    } else {
      const err = await res.text();
      log.value += `❌ Fehler bei ${path}:\n${err}\n`;
    }
  }

  // -----------------------------
  // Workflow starten (unverändert)
  // -----------------------------
  async function startWorkflow() {
    const token = document.getElementById("token").value.trim();
    const log = document.getElementById("log");

    if (!token) {
      log.value += "⚠️ Kein GitHub Token angegeben.\n";
      return;
    }

    log.value += "🚀 Starte Workflow: import_places_manual\n";

    const response = await fetch("https://api.github.com/repos/Sailbuddy/w2h-places-import/actions/workflows/import_places_manual.yml/dispatches", {
      method: "POST",
      headers: {
        Authorization: `token ${token}`,
        Accept: "application/vnd.github.v3+json"
      },
      body: JSON.stringify({ ref: "main" })
    });

    if (response.status === 204) {
      log.value += "✅ Workflow erfolgreich gestartet (Import & Export).\n";
    } else {
      const err = await response.text();
      log.value += `❌ Fehler beim Starten des Workflows:\n${err}\n`;
    }
  }
</script>

</body>
</html>
